# https://docs.readthedocs.io/page/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        # -j auto: read and write the pages on every core of the builder
        - uvx hatch run docs:build -j auto
        - mv docs/_build $READTHEDOCS_OUTPUT

# The tutorials and the reproducibility README are submodules
submodules:
  include: all
  recursive: true
