[envs.default]
installer = "uv"
dependency-groups = ["dev"]

[envs.default.pip]
extra_index_urls = [
  "https://pypi.nvidia.com",
]

[envs.hatch-test]
default-args = []
dependency-groups = ["test"]

overrides.matrix.deps.python = [
  { if = ["stable"], value = "3.13" },
  { if = ["dev"], value = "3.14" },
  { if = ["rapids_prerelease"], value = "3.14" },
]

# `explicit` honours only the prerelease markers below; `dev` needs none (git refs)
overrides.matrix.deps.env-vars = [
  { if = [
    "rapids_prerelease",
  ], key = "UV_PRERELEASE", value = "explicit" },
  { if = [
    "rapids_prerelease",
  ], key = "UV_EXTRA_INDEX_URL", value = "https://pypi.anaconda.org/rapidsai-wheels-nightly/simple" },
]

# Dev: use upstream heads for anndata/scanpy
overrides.matrix.deps.extra-dependencies = [
  { if = [
    "dev",
  ], value = "anndata @ git+https://github.com/scverse/anndata.git" },
  { if = [
    "dev",
  ], value = "scanpy @ git+https://github.com/scverse/scanpy.git" },
]

# Select CUDA feature per matrix
overrides.matrix.cuda.features = [
  { if = ["12"], value = "rapids-cu12" },
  { if = ["13"], value = "rapids-cu13" },
]

# stable tests the oldest RAPIDS the extras allow; dev takes the latest release,
# rapids_prerelease the nightlies. Keep these in step with the floor in pyproject.toml.
overrides.name."stable-12$".extra-dependencies = [
  "cudf-cu12==26.02.*",
  "cuml-cu12==26.02.*",
  "cugraph-cu12==26.02.*",
  "kvikio-cu12==26.02.*",
]
overrides.name."stable-13$".extra-dependencies = [
  "cudf-cu13==26.02.*",
  "cuml-cu13==26.02.*",
  "cugraph-cu13==26.02.*",
  "kvikio-cu13==26.02.*",
]

# uv honours prerelease markers only on direct requirements, so list the whole RAPIDS
# closure. The floor must name the nightly series: with `>=0a0` uv falls back to the
# latest stable release. Bump it after each RAPIDS release (ucxx uses its own 0.x series)
overrides.name."rapids_prerelease-12$".extra-dependencies = [
  "cudf-cu12>=26.12.0a0",
  "cugraph-cu12>=26.12.0a0",
  "cuml-cu12>=26.12.0a0",
  "cuvs-cu12>=26.12.0a0",
  "dask-cudf-cu12>=26.12.0a0",
  "distributed-ucxx-cu12>=0.53.0a0",
  "kvikio-cu12>=26.12.0a0",
  "libcudf-cu12>=26.12.0a0",
  "libcugraph-cu12>=26.12.0a0",
  "libcuml-cu12>=26.12.0a0",
  "libcuvs-cu12>=26.12.0a0",
  "libkvikio-cu12>=26.12.0a0",
  "libnvforest-cu12>=26.12.0a0",
  "libraft-cu12>=26.12.0a0",
  "librmm-cu12>=26.12.0a0",
  "libucxx-cu12>=0.53.0a0",
  "nvforest-cu12>=26.12.0a0",
  "pylibcudf-cu12>=26.12.0a0",
  "pylibcugraph-cu12>=26.12.0a0",
  "pylibraft-cu12>=26.12.0a0",
  "raft-dask-cu12>=26.12.0a0",
  "rmm-cu12>=26.12.0a0",
  "ucxx-cu12>=0.53.0a0",
  "dask-cuda>=26.12.0a0",
  "rapids-dask-dependency>=26.12.0a0",
  "anndata>=0a0",
  "scanpy>=0a0",
]
overrides.name."rapids_prerelease-13$".extra-dependencies = [
  "cudf-cu13>=26.12.0a0",
  "cugraph-cu13>=26.12.0a0",
  "cuml-cu13>=26.12.0a0",
  "cuvs-cu13>=26.12.0a0",
  "dask-cudf-cu13>=26.12.0a0",
  "distributed-ucxx-cu13>=0.53.0a0",
  "kvikio-cu13>=26.12.0a0",
  "libcudf-cu13>=26.12.0a0",
  "libcugraph-cu13>=26.12.0a0",
  "libcuml-cu13>=26.12.0a0",
  "libcuvs-cu13>=26.12.0a0",
  "libkvikio-cu13>=26.12.0a0",
  "libnvforest-cu13>=26.12.0a0",
  "libraft-cu13>=26.12.0a0",
  "librmm-cu13>=26.12.0a0",
  "libucxx-cu13>=0.53.0a0",
  "nvforest-cu13>=26.12.0a0",
  "pylibcudf-cu13>=26.12.0a0",
  "pylibcugraph-cu13>=26.12.0a0",
  "pylibraft-cu13>=26.12.0a0",
  "raft-dask-cu13>=26.12.0a0",
  "rmm-cu13>=26.12.0a0",
  "ucxx-cu13>=0.53.0a0",
  "dask-cuda>=26.12.0a0",
  "rapids-dask-dependency>=26.12.0a0",
  "anndata>=0a0",
  "scanpy>=0a0",
]

[[envs.hatch-test.matrix]]
deps = ["stable", "dev", "rapids_prerelease"]
cuda = ["12", "13"]

[envs.docs]
dependency-groups = ["docs"]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.clean = "git clean -fdX -- {args:docs}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"

[envs.hatch-check-code]
dependencies = ["prek"]
scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"

[envs.hatch-check-fmt]
dependencies = ["prek"]
scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
