<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 944" width="100%" style="max-width:360px" role="img" aria-labelledby="pon-title">
  <title id="pon-title">GATAC pipeline: fragment files to Parquet, filtered Parquet, one tile matrix of the top tiles, clusters, peaks and a peak matrix; the tile, gene, peak-calling and peak-matrix steps read the filtered Parquet files</title>
  <style>
    .pon-t     { fill: var(--pst-color-text-base, #1f2328); font-family: var(--pst-font-family-base, sans-serif); font-size: 14px; font-weight: 600; }
    .pon-m     { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-base, sans-serif); font-size: 12px; }
    .pon-c     { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-monospace, monospace); font-size: 12px; }
    .pon-mid   { text-anchor: middle; }
    .pon-end   { text-anchor: end; }
    .pon-box   { fill: var(--pst-color-surface, #f6f8fa); stroke: #848d97; stroke-width: 1; }
    .pon-sheet { fill: var(--pst-color-background, #ffffff); stroke: #848d97; stroke-width: 1; }
    .pon-flt   { fill: #73b301; fill-opacity: 0.14; stroke: #5a8c00; stroke-width: 1.2; }
    .pon-fltbg { fill: var(--pst-color-background, #ffffff); stroke: #5a8c00; stroke-width: 1.2; }
    .pon-ad    { fill: #4c8bf5; fill-opacity: 0.14; stroke: #3b7ddd; stroke-width: 1.2; }
    .pon-chip  { fill: var(--pst-color-background, #ffffff); stroke: #3b7ddd; stroke-width: 1; }
    .pon-line  { stroke: var(--pst-color-text-muted, #59636e); stroke-width: 1.4; fill: none; }
    .pon-head  { fill: var(--pst-color-text-muted, #59636e); }
    .pon-read  { stroke: #5a8c00; stroke-width: 1.8; fill: none; }
    .pon-rhead { fill: #5a8c00; }
    .pon-num   { fill: var(--pst-color-text-base, #1f2328); }
    .pon-band0 { fill: var(--pst-color-text-muted, #59636e); fill-opacity: 0.05; stroke: var(--pst-color-border, #d0d7de); stroke-width: 1; }
    .pon-band1 { fill: #4c8bf5; fill-opacity: 0.06; stroke: #4c8bf5; stroke-opacity: 0.45; stroke-width: 1; }
    .pon-tab0  { fill: var(--pst-color-text-muted, #59636e); fill-opacity: 0.16; }
    .pon-tab1  { fill: #4c8bf5; fill-opacity: 0.22; }
    .pon-sech  { fill: var(--pst-color-text-base, #1f2328); font-family: var(--pst-font-family-base, sans-serif); font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; }
    .pon-sec   { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-base, sans-serif); font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; }
    html[data-theme="dark"] .pon-flt, html[data-theme="dark"] .pon-fltbg, html[data-theme="dark"] .pon-read { stroke: #73b301; }
    html[data-theme="dark"] .pon-rhead { fill: #73b301; }
    html[data-theme="dark"] .pon-ad, html[data-theme="dark"] .pon-chip { stroke: #4c8bf5; }
    html[data-theme="dark"] .pon-box, html[data-theme="dark"] .pon-sheet { stroke: #6e7781; }
    .pon-numt  { fill: var(--pst-color-background, #ffffff); font-family: var(--pst-font-family-base, sans-serif); font-size: 11px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="pon-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="pon-head"/></marker>
    <marker id="pon-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="pon-rhead"/></marker>
  </defs>
  <g transform="translate(0,8)">
  <rect x="2" y="320" width="356" height="562" rx="8" class="pon-band1"/>
  <path d="M2,342 V328 Q2,320 10,320 H350 Q358,320 358,328 V342 Z" class="pon-tab1"/>
  <text x="180" y="335" class="pon-sech pon-mid">COMBINE ALL SAMPLES</text>

  <!-- fragments.tsv.gz, one per sample -->
  <rect x="42" y="4" width="316" height="50" rx="6" class="pon-sheet"/>
  <rect x="38" y="8" width="316" height="50" rx="6" class="pon-sheet"/>
  <rect x="34" y="12" width="316" height="50" rx="6" class="pon-box"/>
  <text x="192" y="33" class="pon-t pon-mid">fragments.tsv.gz</text>
  <text x="192" y="51" class="pon-m pon-mid">one per sample, names as text in every row</text>
  <path d="M192,62 V88" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="202" y="80" class="pon-c">gatac convert</text>

  <!-- 1. Parquet, one per sample -->
  <rect x="42" y="90" width="316" height="50" rx="6" class="pon-sheet"/>
  <rect x="38" y="94" width="316" height="50" rx="6" class="pon-sheet"/>
  <rect x="34" y="98" width="316" height="50" rx="6" class="pon-box"/>
  <text x="192" y="119" class="pon-t pon-mid">Parquet fragments</text>
  <text x="192" y="137" class="pon-m pon-mid">integer ids, barcode table in the file</text>
  <circle cx="34" cy="98" r="9" class="pon-num"/>
  <text x="34" y="102" class="pon-numt">1</text>

  <!-- 2. QC tables, then the filter -->
  <path d="M263,148 V164" class="pon-line" marker-end="url(#pon-a)"/>
  <rect x="176" y="166" width="174" height="48" rx="6" class="pon-box"/>
  <text x="263" y="186" class="pon-t pon-mid">QC per cell</text>
  <text x="263" y="204" class="pon-c pon-mid">metrics · doublets</text>
  <path d="M176,190 H106" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="263" y="232" class="pon-m pon-mid">query on the metrics</text>
  <path d="M104,148 V240" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="94" y="176" class="pon-c pon-end">gatac filter</text>

  <!-- 2. Filtered Parquet, one per sample -->
  <rect x="42" y="242" width="316" height="50" rx="6" class="pon-fltbg"/>
  <rect x="38" y="246" width="316" height="50" rx="6" class="pon-fltbg"/>
  <rect x="34" y="250" width="316" height="50" rx="6" class="pon-fltbg"/>
  <rect x="34" y="250" width="316" height="50" rx="6" class="pon-flt"/>
  <text x="192" y="271" class="pon-t pon-mid">Filtered Parquet fragments</text>
  <text x="192" y="289" class="pon-m pon-mid">the cells that pass QC, one file per sample</text>
  <circle cx="34" cy="250" r="9" class="pon-num"/>
  <text x="34" y="254" class="pon-numt">2</text>

  <!-- reads of the filtered files: a bus down the left edge -->
  <path d="M34,275 H12 V849 H32" class="pon-read" marker-end="url(#pon-g)"/>
  <path d="M12,399 H44" class="pon-read" marker-end="url(#pon-g)"/>
  <path d="M12,479 H44" class="pon-read" marker-end="url(#pon-g)"/>
  <path d="M12,657 H32" class="pon-read" marker-end="url(#pon-g)"/>
  <path d="M12,739 H32" class="pon-read" marker-end="url(#pon-g)"/>
  <g transform="translate(0,30)">

  <!-- 3. One tile matrix, top tiles -->
  <rect x="34" y="324" width="316" height="170" rx="6" class="pon-ad"/>
  <text x="192" y="346" class="pon-t pon-mid">One tile matrix, top n tiles</text>
  <rect x="46" y="356" width="292" height="26" rx="4" class="pon-chip"/>
  <text x="192" y="373" class="pon-m pon-mid">pass 1 · scan: tile statistics</text>
  <rect x="46" y="396" width="292" height="26" rx="4" class="pon-chip"/>
  <text x="192" y="413" class="pon-m pon-mid">select the top n tiles</text>
  <rect x="46" y="436" width="292" height="26" rx="4" class="pon-chip"/>
  <text x="192" y="453" class="pon-m pon-mid">pass 2 · build: those tiles only</text>
  <path d="M192,382 V395" class="pon-line" marker-end="url(#pon-a)"/>
  <path d="M192,422 V435" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="192" y="482" class="pon-c pon-mid">gatac tile -n · cells × selected tiles</text>
  <circle cx="34" cy="324" r="9" class="pon-num"/>
  <text x="34" y="328" class="pon-numt">3</text>
  <path d="M192,494 V518" class="pon-line" marker-end="url(#pon-a)"/>

  <!-- 4. Embedding and clusters -->
  <rect x="34" y="520" width="316" height="50" rx="6" class="pon-box"/>
  <text x="192" y="541" class="pon-t pon-mid">Embedding and clusters</text>
  <text x="192" y="559" class="pon-c pon-mid">dr.spectral → kNN → Leiden</text>
  <circle cx="34" cy="520" r="9" class="pon-num"/>
  <text x="34" y="524" class="pon-numt">4</text>
  <path d="M192,570 V600" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="202" y="590" class="pon-m">clusters in obs</text>

  <!-- 5. Peaks per cluster -->
  <rect x="34" y="602" width="316" height="50" rx="6" class="pon-box"/>
  <text x="192" y="623" class="pon-t pon-mid">Peaks per cluster, merged</text>
  <text x="192" y="641" class="pon-c pon-mid">peak.call (MACS3) → peak.merge</text>
  <circle cx="34" cy="602" r="9" class="pon-num"/>
  <text x="34" y="606" class="pon-numt">5</text>
  <path d="M192,652 V682" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="202" y="672" class="pon-m">peak set</text>

  <!-- 6. Peak matrix -->
  <rect x="34" y="684" width="316" height="50" rx="6" class="pon-ad"/>
  <text x="192" y="705" class="pon-t pon-mid">Peak matrix</text>
  <text x="192" y="723" class="pon-c pon-mid">peak.make_matrix · cells × peaks</text>
  <circle cx="34" cy="684" r="9" class="pon-num"/>
  <text x="34" y="688" class="pon-numt">6</text>
  <path d="M192,734 V754" class="pon-line" marker-end="url(#pon-a)"/>
  <text x="192" y="771" class="pon-m pon-mid">markers, motif enrichment, chromVAR</text>

  <!-- Gene matrix -->
  <rect x="34" y="794" width="316" height="50" rx="6" class="pon-ad"/>
  <text x="192" y="815" class="pon-t pon-mid">Gene matrix</text>
  <text x="192" y="833" class="pon-c pon-mid">gatac gene · cells × genes</text>
  </g>

  <!-- legend -->
  <path d="M12,898 H38" class="pon-read" marker-end="url(#pon-g)"/>
  <text x="46" y="902" class="pon-m">reads the filtered Parquet files</text>
  <rect x="18" y="910" width="18" height="13" rx="6" class="pon-sheet"/>
  <rect x="15" y="913" width="18" height="13" rx="6" class="pon-sheet"/>
  <rect x="12" y="916" width="18" height="13" rx="6" class="pon-box"/>
  <text x="46" y="926" class="pon-m">one file per sample</text>
  <rect x="186" y="914" width="18" height="14" rx="3" class="pon-ad"/>
  <text x="212" y="926" class="pon-m">one AnnData, all samples</text>
  </g>
</svg>
