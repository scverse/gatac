<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" width="100%" style="max-width:360px" role="img" aria-labelledby="rt-peaks-title-n">
  <title id="rt-peaks-title-n">Run time from the fragment files to the peak matrix: SnapATAC2 9 h 41 min, GATAC 43 min</title>
  <style>
    .rtn-text  { fill: var(--pst-color-text-base, #1f2328); font-family: var(--pst-font-family-base, sans-serif); font-size: 13px; }
    .rtn-muted { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-base, sans-serif); font-size: 12px; }
    .rtn-bold  { font-weight: 600; }
    .rtn-seg   { font-family: var(--pst-font-family-base, sans-serif); font-size: 11.5px; }
    .rtn-s1 { fill: #2a78d6; } .rtn-i1 { fill: #fff; }
    .rtn-s2 { fill: #eb6834; } .rtn-i2 { fill: #fff; }
    .rtn-s3 { fill: #1baf7a; } .rtn-i3 { fill: #0b0b0b; }
    .rtn-s4 { fill: #eda100; } .rtn-i4 { fill: #0b0b0b; }
    .rtn-s5 { fill: #e87ba4; } .rtn-i5 { fill: #0b0b0b; }
    .rtn-s6 { fill: #008300; } .rtn-i6 { fill: #fff; }
    .rtn-s7 { fill: #6250d6; } .rtn-i7 { fill: #fff; }
    html[data-theme="dark"] .rtn-s1 { fill: #3987e5; } html[data-theme="dark"] .rtn-i1 { fill: #fff; }
    html[data-theme="dark"] .rtn-s2 { fill: #d95926; } html[data-theme="dark"] .rtn-i2 { fill: #fff; }
    html[data-theme="dark"] .rtn-s3 { fill: #199e70; } html[data-theme="dark"] .rtn-i3 { fill: #fff; }
    html[data-theme="dark"] .rtn-s4 { fill: #c98500; } html[data-theme="dark"] .rtn-i4 { fill: #0b0b0b; }
    html[data-theme="dark"] .rtn-s5 { fill: #e8679a; } html[data-theme="dark"] .rtn-i5 { fill: #0b0b0b; }
    html[data-theme="dark"] .rtn-s6 { fill: #1f9a1f; } html[data-theme="dark"] .rtn-i6 { fill: #fff; }
    html[data-theme="dark"] .rtn-s7 { fill: #7a6ae0; } html[data-theme="dark"] .rtn-i7 { fill: #fff; }
  </style>
  <rect x="8.0" y="8" width="12" height="12" rx="3" class="rtn-s1"/>
  <text x="26.0" y="18" class="rtn-muted">Import</text>
  <rect x="79.2" y="8" width="12" height="12" rx="3" class="rtn-s2"/>
  <text x="97.2" y="18" class="rtn-muted">QC + filter</text>
  <rect x="181.4" y="8" width="12" height="12" rx="3" class="rtn-s3"/>
  <text x="199.4" y="18" class="rtn-muted">Tiles + selection</text>
  <rect x="8.0" y="28" width="12" height="12" rx="3" class="rtn-s4"/>
  <text x="26.0" y="38" class="rtn-muted">Embedding + clusters</text>
  <rect x="166.0" y="28" width="12" height="12" rx="3" class="rtn-s5"/>
  <text x="184.0" y="38" class="rtn-muted">Gene matrix</text>
  <rect x="8.0" y="48" width="12" height="12" rx="3" class="rtn-s6"/>
  <text x="26.0" y="58" class="rtn-muted">Peak calling</text>
  <rect x="116.4" y="48" width="12" height="12" rx="3" class="rtn-s7"/>
  <text x="134.4" y="58" class="rtn-muted">Peak matrix</text>
  <g><title>Import: SnapATAC2 1 h 18 min, GATAC 15 min (×5.1)</title>
    <rect x="60" y="372.7" width="104" height="38.3" rx="3" class="rtn-s1"/>
    <text x="112.0" y="395.9" text-anchor="middle" class="rtn-seg rtn-i1">Import 1 h 18 min</text>
  </g>
  <g><title>QC + filter: SnapATAC2 9.3 min, GATAC 3.9 min (×2.4)</title>
    <rect x="60" y="366.9" width="104" height="3.8" rx="3" class="rtn-s2"/>
  </g>
  <g><title>Tiles + selection: SnapATAC2 42 min, GATAC 3.5 min (×12.1)</title>
    <rect x="60" y="344.4" width="104" height="20.5" rx="3" class="rtn-s3"/>
    <text x="112.0" y="358.7" text-anchor="middle" class="rtn-seg rtn-i3">42 min</text>
  </g>
  <g><title>Embedding + clusters: SnapATAC2 36 min, GATAC 37 s (×59.1)</title>
    <rect x="60" y="325.0" width="104" height="17.4" rx="3" class="rtn-s4"/>
    <text x="112.0" y="337.7" text-anchor="middle" class="rtn-seg rtn-i4">36 min</text>
  </g>
  <g><title>Gene matrix: SnapATAC2 21 min, GATAC 2.3 min (×8.9)</title>
    <rect x="60" y="313.4" width="104" height="9.6" rx="3" class="rtn-s5"/>
  </g>
  <g><title>Peak calling: SnapATAC2 6 h 20 min, GATAC 16 min (×24.3)</title>
    <rect x="60" y="121.2" width="104" height="190.1" rx="3" class="rtn-s6"/>
    <text x="112.0" y="220.3" text-anchor="middle" class="rtn-seg rtn-i6">6 h 20 min</text>
  </g>
  <g><title>Peak matrix: SnapATAC2 14 min, GATAC 1.4 min (×10.0)</title>
    <rect x="60" y="113.0" width="104" height="6.2" rx="3" class="rtn-s7"/>
  </g>
  <text x="112.0" y="102.0" text-anchor="middle" class="rtn-text rtn-bold">9 h 41 min</text>
  <text x="112.0" y="434" text-anchor="middle" class="rtn-text rtn-bold">SnapATAC2</text>
  <g><title>Import: GATAC 15 min, SnapATAC2 1 h 18 min (×5.1)</title>
    <rect x="196" y="404.1" width="104" height="6.9" rx="3" class="rtn-s1"/>
  </g>
  <g><title>QC + filter: GATAC 3.9 min, SnapATAC2 9.3 min (×2.4)</title>
    <rect x="196" y="401.0" width="104" height="1.1" rx="3" class="rtn-s2"/>
  </g>
  <g><title>Tiles + selection: GATAC 3.5 min, SnapATAC2 42 min (×12.1)</title>
    <rect x="196" y="398.1" width="104" height="1.0" rx="3" class="rtn-s3"/>
  </g>
  <g><title>Embedding + clusters: GATAC 37 s, SnapATAC2 36 min (×59.1)</title>
    <rect x="196" y="396.4" width="104" height="1.0" rx="3" class="rtn-s4"/>
  </g>
  <g><title>Gene matrix: GATAC 2.3 min, SnapATAC2 21 min (×8.9)</title>
    <rect x="196" y="394.1" width="104" height="1.0" rx="3" class="rtn-s5"/>
  </g>
  <g><title>Peak calling: GATAC 16 min, SnapATAC2 6 h 20 min (×24.3)</title>
    <rect x="196" y="385.1" width="104" height="7.0" rx="3" class="rtn-s6"/>
  </g>
  <g><title>Peak matrix: GATAC 1.4 min, SnapATAC2 14 min (×10.0)</title>
    <rect x="196" y="383.2" width="104" height="1.0" rx="3" class="rtn-s7"/>
  </g>
  <text x="248.0" y="356.2" text-anchor="middle" class="rtn-text rtn-bold">43 min</text>
  <text x="248.0" y="372.2" text-anchor="middle" class="rtn-text rtn-bold">×13.6 faster</text>
  <text x="248.0" y="434" text-anchor="middle" class="rtn-text rtn-bold">GATAC</text>
</svg>
