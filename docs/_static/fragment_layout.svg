<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 0 658 635" width="100%" style="max-width:720px;display:block;margin:0 auto" role="img" aria-labelledby="fl-layout-title">
  <title id="fl-layout-title">From fragments.tsv.gz to a GATAC Parquet file</title>
  <style>
    .fl-text  { fill: var(--pst-color-text-base, #1f2328); font-family: var(--pst-font-family-base, sans-serif); font-size: 13px; }
    .fl-muted { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-base, sans-serif); font-size: 11px; }
    .fl-mono  { fill: var(--pst-color-text-base, #1f2328); font-family: var(--pst-font-family-monospace, monospace); font-size: 12px; }
    .fl-null  { fill: var(--pst-color-text-muted, #59636e); font-family: var(--pst-font-family-monospace, monospace); font-size: 12px; font-style: italic; }
    .fl-bold  { font-weight: 600; }
    .fl-delta { fill: #205cb3; font-weight: 600; }
    html[data-theme="dark"] .fl-delta { fill: #91b8ff; }
    .fl-plain { fill: var(--pst-color-background, #fff); stroke: var(--pst-color-border, #d0d7de); stroke-width: 1.2; }
    .fl-chr { fill: #4d7c0f; } .fl-bcx { fill: #b07a00; } html[data-theme="dark"] .fl-bcx { fill: #e0a020; } html[data-theme="dark"] .fl-chr { fill: #9fd356; }
    .fl-box   { fill: var(--pst-color-surface, #f6f8fa); stroke: var(--pst-color-border, #d0d7de); stroke-width: 1; }
    .fl-file  { fill: none; stroke: var(--pst-color-text-muted, #59636e); stroke-width: 1.2; }
    .fl-line  { stroke: var(--pst-color-text-muted, #59636e); stroke-width: 1.4; fill: none; }
    .fl-head  { fill: var(--pst-color-text-muted, #59636e); }
    .fl-id    { fill: #73b301; fill-opacity: 0.14; stroke: #73b301; stroke-width: 1.2; }
    .fl-val   { fill: #4c8bf5; fill-opacity: 0.14; stroke: #4c8bf5; stroke-width: 1.2; }
    .fl-bc    { fill: #e0a020; fill-opacity: 0.16; stroke: #e0a020; stroke-width: 1.2; }
    .fl-foot  { fill: #9b6bd3; fill-opacity: 0.14; stroke: #9b6bd3; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="fl-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fl-head"/>
    </marker>
  </defs>

  <!-- fragments.tsv.gz -->
  <text x="20" y="20" class="fl-text"><tspan class="fl-bold">fragments.tsv.gz</tspan><tspan class="fl-muted" dx="8">names in every row</tspan></text>
  <rect x="20" y="30" width="656" height="106" rx="6" class="fl-box"/>
  <text y="52" class="fl-muted"><tspan x="36">chrom</tspan><tspan x="90">start</tspan><tspan x="150">end</tspan><tspan x="210">barcode</tspan><tspan x="300">count</tspan></text>
  <text y="72" class="fl-mono"><tspan x="36" class="fl-chr">chr1</tspan><tspan x="90">10001</tspan><tspan x="150">10200</tspan><tspan x="210" class="fl-bcx">AAACGAAC-1</tspan><tspan x="300">2</tspan></text>
  <text y="90" class="fl-mono"><tspan x="36" class="fl-chr">chr1</tspan><tspan x="90">10035</tspan><tspan x="150">10180</tspan><tspan x="210" class="fl-bcx">TTGCATGA-1</tspan><tspan x="300">1</tspan></text>
  <text y="108" class="fl-mono"><tspan x="36" class="fl-chr">chr1</tspan><tspan x="90">10102</tspan><tspan x="150">10388</tspan><tspan x="210" class="fl-bcx">TTGCATGA-1</tspan><tspan x="300">1</tspan></text>
  <text y="126" class="fl-mono"><tspan x="36" class="fl-chr">chr1</tspan><tspan x="90">10240</tspan><tspan x="150">10511</tspan><tspan x="210" class="fl-bcx">GCTTAGCA-1</tspan><tspan x="300">3</tspan></text>
  <text x="386" y="72" class="fl-muted"><tspan class="fl-chr fl-bold">chrom</tspan> → chrom_id, an index into gatac.chroms</text>
  <text x="386" y="90" class="fl-muted"><tspan class="fl-bcx fl-bold">barcode</tspan> → barcode_id, a row of the barcode table</text>
  <text x="386" y="108" class="fl-muted">end → length = end − start</text>

  <!-- conversion arrow -->
  <path d="M198,140 V180" class="fl-line" marker-end="url(#fl-arrow-a)"/>
  <text x="210" y="165" class="fl-text fl-bold">make_parquet · gatac convert</text>

  <!-- the parquet file -->
  <rect x="20" y="186" width="656" height="437" rx="8" class="fl-file"/>
  <text x="36" y="208" class="fl-text fl-bold">pbmc.parquet</text>
  <text x="36" y="225" class="fl-muted">delta: change from the row above (+34, −79) · split: bytes stored by position</text>

  <!-- row group 0 -->
  <rect x="36" y="234" width="624" height="234" rx="6" class="fl-box"/>
  <text x="48" y="252" class="fl-muted">row group 0 · 1,000,000 rows · pages compressed with ZSTD</text>
  <rect x="48" y="284" width="64" height="172" rx="4" class="fl-id"/>
  <rect x="118" y="284" width="56" height="172" rx="4" class="fl-plain"/>
  <rect x="180" y="284" width="56" height="172" rx="4" class="fl-plain"/>
  <rect x="242" y="284" width="78" height="172" rx="4" class="fl-bc"/>
  <rect x="326" y="284" width="50" height="172" rx="4" class="fl-plain"/>
  <rect x="386" y="284" width="90" height="172" rx="4" class="fl-bc"/>
  <rect x="482" y="284" width="86" height="172" rx="4" class="fl-bc"/>
  <rect x="574" y="284" width="74" height="172" rx="4" class="fl-bc"/>
  <text x="48" y="272" class="fl-text fl-bold">fragments: one row per fragment</text>
  <text x="386" y="272" class="fl-text fl-bold">barcode table: row i = barcode_id i</text>
  <text y="302" class="fl-text fl-bold" style="font-size:11px"><tspan x="56">chrom_id</tspan><tspan x="126">start</tspan><tspan x="188">length</tspan><tspan x="250">barcode_id</tspan><tspan x="334">count</tspan><tspan x="394">bc_name</tspan><tspan x="490">bc_n_unique</tspan><tspan x="582">bc_n_total</tspan></text>
  <text y="317" class="fl-muted"><tspan x="56">dict</tspan><tspan x="126">delta</tspan><tspan x="188">split</tspan><tspan x="250">split</tspan><tspan x="334">split</tspan><tspan x="394">delta lengths</tspan><tspan x="490">delta</tspan><tspan x="582">delta</tspan></text>
  <text y="331" class="fl-muted"><tspan x="56">uint16</tspan><tspan x="126">uint32</tspan><tspan x="188">uint32</tspan><tspan x="250">uint32</tspan><tspan x="334">uint32</tspan><tspan x="394">string</tspan><tspan x="490">uint32</tspan><tspan x="582">uint32</tspan></text>
  <path d="M48,341 H376 M386,341 H648" class="fl-line" style="stroke-width:0.8"/>
  <text y="364" class="fl-mono"><tspan x="56">0</tspan><tspan x="126">10001</tspan><tspan x="188">199</tspan><tspan x="250">1</tspan><tspan x="334">2</tspan><tspan x="394">TTGCATGA-1</tspan><tspan x="490">41203</tspan><tspan x="582">97410</tspan></text>
  <text y="386" class="fl-mono"><tspan x="56">0</tspan><tspan x="126" class="fl-delta">+34</tspan><tspan x="188">145</tspan><tspan x="250">0</tspan><tspan x="334">1</tspan><tspan x="394">AAACGAAC-1</tspan><tspan x="490" class="fl-delta">−2253</tspan><tspan x="582" class="fl-delta">−7288</tspan></text>
  <text y="408" class="fl-mono"><tspan x="56">0</tspan><tspan x="126" class="fl-delta">+67</tspan><tspan x="188">286</tspan><tspan x="250">0</tspan><tspan x="334">1</tspan><tspan x="394">GCTTAGCA-1</tspan><tspan x="490" class="fl-delta">−79</tspan><tspan x="582" class="fl-delta">+913</tspan></text>
  <text y="430" class="fl-mono"><tspan x="56">0</tspan><tspan x="126" class="fl-delta">+138</tspan><tspan x="188">271</tspan><tspan x="250">2</tspan><tspan x="334">3</tspan></text>
  <text y="430" class="fl-null"><tspan x="394">null</tspan><tspan x="490">null</tspan><tspan x="582">null</tspan></text>
  <text y="448" class="fl-muted"><tspan x="78">⋮</tspan><tspan x="144">⋮</tspan><tspan x="206">⋮</tspan><tspan x="279">⋮</tspan><tspan x="349">⋮</tspan><tspan x="429">⋮</tspan><tspan x="523">⋮</tspan><tspan x="609">⋮</tspan></text>

  <!-- later row groups -->
  <rect x="36" y="480" width="624" height="40" rx="6" class="fl-box"/>
  <text x="48" y="504" class="fl-muted">row groups 1 … N · up to 1,000,000 rows each · bc_* columns all null (almost no space)</text>

  <!-- footer -->
  <rect x="36" y="532" width="624" height="77" rx="6" class="fl-foot"/>
  <text x="48" y="555" class="fl-text fl-bold">footer (key-value metadata, not compressed)</text>
  <text x="48" y="577" class="fl-mono" style="font-size:11px">gatac.format_version = 1 · <tspan class="fl-chr">gatac.chroms = ["chr1", "chr2", …]</tspan></text>
  <text x="48" y="596" class="fl-mono" style="font-size:11px">gatac.n_barcodes = 3 · gatac.barcode_prefix = "pbmc_"</text>
</svg>
