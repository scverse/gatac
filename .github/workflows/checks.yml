name: Checks

# What needs no GPU, on every push and pull request: the package build and its
# metadata, the wheel installed without a CUDA extra, and the docs. Lint and
# format are pre-commit, run by autofix.ci (autofix.yaml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, for the hatch-vcs version
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: uv build
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      - name: Without a CUDA extra, the CLI parses and the modules name the extra to install
        run: |
          uv venv --python 3.13 /tmp/plain
          uv pip install --python /tmp/plain dist/*.whl
          /tmp/plain/bin/gatac --version
          /tmp/plain/bin/gatac --help > /dev/null
          if /tmp/plain/bin/python -c "import gatac.pp" 2> err.txt; then
            echo "::error::import gatac.pp succeeded without RAPIDS"; exit 1
          fi
          tail -1 err.txt
          grep -q "gatac\[rapids-cu12\]" err.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # as on Read the Docs
          python-version: "3.13"
      - name: Build the docs, warnings as errors
        run: uv run --group docs sphinx-build -W --keep-going -T -b html docs docs/_build/html
