name: Checks

# What needs no GPU, on every push and pull request: lint, the package build
# and its metadata, the wheel installed without a CUDA extra, and the docs.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: pre-commit (ruff check, YAML/TOML)
        run: uv run --only-group dev pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, for the hatch-vcs version
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: uv build
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      - name: Without a CUDA extra, import gatac names the extra to install
        run: |
          uv venv --python 3.12 /tmp/plain
          uv pip install --python /tmp/plain dist/*.whl
          if /tmp/plain/bin/python -c "import gatac" 2> err.txt; then
            echo "::error::import gatac succeeded without RAPIDS"; exit 1
          fi
          cat err.txt
          grep -q "gatac\[cuda12\]" err.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # as on Read the Docs
          python-version: "3.13"
      - name: Build the docs, warnings as errors
        run: uv run --group docs sphinx-build -W --keep-going -T -b html docs docs/_build/html
