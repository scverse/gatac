name: GPU Tests

# GATAC imports cudf at module level, so the whole suite needs a GPU. It runs on
# a Cirun AWS runner (see .cirun.yml); to save GPU time, pull requests only run
# with the 'run-gpu-ci' label. Locally, act runs it on your own GPU, as the
# image's non-root user like a hosted runner:
#   act push "--container-options=--gpus=all --user ubuntu"
# Add "-v act-uv-cache:/home/ubuntu/.cache/uv" to the options to keep uv's cache
# across runs (create the volume once and chown it to 1000). The Codecov uploads
# are skipped under act.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

# Cancel the job if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.mode.outputs.skip }}
    steps:
      - name: Require push to main, 'run-gpu-ci' or 'skip-gpu-ci' label
        id: mode
        env:
          RUN: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-gpu-ci') }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-gpu-ci') }}
        run: |
          if [[ "$RUN" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP" == "true" ]]; then
            echo "::notice::GPU CI skipped by the 'skip-gpu-ci' label."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GPU CI requires a push to main or the 'run-gpu-ci' or 'skip-gpu-ci' label on the PR."
            exit 1
          fi

  test:
    name: Test (${{ matrix.cuda }})
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: cirun-aws-gpu-t4
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # cuda12 works as well; one extra keeps it to one GPU job per run
        cuda: [cuda13]
    env:
      # Kernels CuPy compiles at run time (gatac.gpu, motif, tobias), cached across runs
      CUPY_CACHE_DIR: ${{ github.workspace }}/.cache/cupy
      # Numba's cache=True functions; editable installs would otherwise write them into gatac/
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.cache/numba
      # The driver's PTX-to-SASS cache, for kernels shipped without code for this GPU
      CUDA_CACHE_PATH: ${{ github.workspace }}/.cache/nv
      # Python 3.12+ monitoring API: coverage adds a few percent instead of ~30%
      COVERAGE_CORE: sysmon
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History (for the mtimes and the hatch-vcs version) without old file contents
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Restore file mtimes from git
        # Numba's cache is keyed on the source's mtime; a fresh checkout would invalidate all of it
        run: |
          git ls-files -z gatac | xargs -0 -P 4 -n 50 sh -c 'for f; do touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"; done' sh

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The oldest Python GATAC supports, as rapids_singlecell's stable job
          python-version: "3.12"
          # No uv cache: the RAPIDS wheels make it ~4 GB, slower to restore than to download
          enable-cache: false

      - name: Restore JIT caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: ${{ matrix.cuda }}-cache-${{ github.run_id }}
          restore-keys: ${{ matrix.cuda }}-cache-

      - name: Check NVIDIA SMI
        run: |
          id
          nvidia-smi

      - name: Install dependencies
        run: uv sync --extra ${{ matrix.cuda }} --group test

      - name: Run tests
        run: |
          mkdir -p test-data
          uv run --no-sync coverage run -m pytest -v --color=yes -ra --junitxml=test-data/test-results.xml

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage xml
          uv run --no-sync coverage report --sort=cover --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() && !env.ACT }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: test-data/test-results.xml
          use_oidc: false
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage data
        if: ${{ !env.ACT }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: test-data/coverage.xml
          use_oidc: false
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  remove-label:
    name: Remove 'run-gpu-ci' Label
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-gpu-ci') }}
    permissions:
      pull-requests: write
    steps:
      - name: Remove 'run-gpu-ci' label
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-gpu-ci" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single check for branch protection; passes when the 'skip-gpu-ci' label skipped the tests
  all-green:
    name: CI-Pass
    if: always()
    needs:
      - check
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        if: needs.check.outputs.skip != 'true'
        run: |
          if [[ "${{ needs.check.result }}" != "success" || "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Required jobs did not succeed (check=${{ needs.check.result }}, test=${{ needs.test.result }})."
            exit 1
          fi
