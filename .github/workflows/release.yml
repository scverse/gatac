name: Release

# Publishing a GitHub release of a tag vX.Y.Z uploads that version to PyPI,
# through PyPI's trusted publishing (no token): the PyPI project trusts this
# workflow of scverse/gatac in the "pypi" environment. The version comes from
# the tag (hatch-vcs), so the release's tag must be on the commit to publish.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Build the sdist and wheel
        run: uv build
      - name: The version is the release's tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls dist
          test -f "dist/gatac-${TAG#v}.tar.gz" || { echo "::error::dist/ has no gatac-${TAG#v}"; exit 1; }
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gatac
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
