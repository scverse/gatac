name: Release

# Publishing a GitHub release of a tag vX.Y.Z uploads that version to PyPI,
# through PyPI's trusted publishing (no token): the PyPI project trusts this
# workflow of scverse/gatac in the "pypi" environment. The version comes from
# the tag (hatch-vcs), so the release's tag must be on the commit to publish.
#
# Running the workflow by hand (Actions > Release > Run workflow) uploads the
# chosen branch to TestPyPI instead, as the version given (e.g. 0.1.0rc1), in
# the "testpypi" environment. TestPyPI, like PyPI, never takes a version twice.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to upload to TestPyPI (e.g. 0.1.0rc1)
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Build the sdist and wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION"; fi
          uv build
      - name: The version is the release's tag, or the one given
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          ls dist
          test -f "dist/gatac-${TAG#v}.tar.gz" || { echo "::error::dist/ has no gatac-${TAG#v}"; exit 1; }
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gatac
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gatac
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
