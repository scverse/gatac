name: GPU Tests

# GATAC imports cudf at module level, so the whole suite needs a GPU. It runs on
# a Cirun AWS T4 (see .cirun.yml), in the hatch-test environments of hatch.toml;
# to save GPU time, pull requests only run with the 'run-gpu-ci' label, and
# changes to only docs/, Markdown files or the submodules skip it.
# pytest runs on four xdist workers (addopts in pyproject.toml).
# ci/modal_gpu.py runs the test-stable-dev job on a Modal GPU, from this file and
# hatch.toml: keep its steps' `hatch run "${ENV_NAME}:<script>"` form.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - labeled
      - opened
      - synchronize
# Cancel the job if new commits are pushed
# https://stackoverflow.com/questions/66335225/how-to-cancel-previous-runs-in-the-pr-when-you-push-new-commitsupdate-the-curre
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.mode.outputs.skip }}
    steps:
      # Skipped in this job rather than with `paths-ignore`, so that CI-Pass and
      # All Tests Green still report (and pass) when there is nothing to test.
      - name: Only docs, Markdown or submodule changes?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The changed files; none when unknown (a new branch, a push past the
          # compare API's 300 files, or an API error), which runs the tests
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=""
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
              --jq 'if (.files | length) < 300 then .files[].filename else empty end') || files=""
          else
            files=""
          fi
          printf '%s\n' "$files"
          # docs/, any .md file, and the reproducibility and tutorials submodules
          ignored='^(docs/|reproducibility$|tutorials$)|\.md$'
          if [[ -n "$files" ]] && ! grep -Evq "$ignored" <<< "$files"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require push to main, 'run-gpu-ci' or 'skip-gpu-ci' label
        id: mode
        env:
          LABEL_RUN: ${{ contains(github.event.pull_request.labels.*.name, 'run-gpu-ci') }}
          PUSH: ${{ github.event_name == 'push' }}
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-gpu-ci') }}
        run: |
          if [[ "$LABEL_RUN" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$DOCS_ONLY" == "true" ]]; then
            echo "::notice::GPU CI skipped: only docs, Markdown or submodule changes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PUSH" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP" == "true" ]]; then
            echo "::notice::GPU CI skipped by the 'skip-gpu-ci' label."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GPU CI requires a push to main or the 'run-gpu-ci' or 'skip-gpu-ci' label on the PR."
            exit 1
          fi

  get-envs:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip != 'true'
    permissions:
      contents: read
    outputs:
      stable-dev: ${{ steps.get-envs.outputs.stable-dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - id: get-envs
        run: |
          # Stable + dev, all cu13 (all T4; no other GPU capacity is available)
          STABLE_DEV_JSON=$(uvx hatch env show --json | jq -c '
            to_entries
            | map(
              select(.key | startswith("hatch-test"))
              | select(
                ((.key | contains("stable")) and (.key | endswith("13")))
                or ((.key | contains("dev")) and (.key | endswith("13")))
              )
              | {
                name: .key,
                python: .value.python | sub("3[.]13"; "3.13.3"),
                runner: "cirun-aws-gpu-t4",
              }
            )')
          echo "stable-dev=${STABLE_DEV_JSON}" | tee -a "$GITHUB_OUTPUT"

  test-stable-dev:
    name: Test (${{ matrix.env.name }})
    needs: get-envs
    runs-on: ${{ matrix.env.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        env: ${{ fromJson(needs.get-envs.outputs.stable-dev) }}
    env:
      ENV_NAME: ${{ matrix.env.name }}
      # Kernels CuPy compiles at run time (gatac.gpu, motif, tobias), cached across runs
      CUPY_CACHE_DIR: ${{ github.workspace }}/.cache/cupy
      # Cache of the Numba cache=True functions, which editable installs would otherwise write into src/gatac/
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.cache/numba
      # The driver's PTX-to-SASS cache, for kernels shipped without code for this GPU
      CUDA_CACHE_PATH: ${{ github.workspace }}/.cache/nv
      # Python 3.12+ monitoring API: coverage adds a few percent instead of ~30%
      COVERAGE_CORE: sysmon
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Restore file mtimes from git
        # Numba's cache is keyed on the source's mtime; a fresh checkout would invalidate all of it
        run: |
          git ls-files -z src/gatac | xargs -0 -P 4 -n 50 sh -c 'for f; do touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"; done' sh

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.env.python }}

      - name: Restore JIT caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: ${{ matrix.env.name }}-jit-${{ github.run_id }}
          restore-keys: ${{ matrix.env.name }}-jit-

      - name: Add CUDA to PATH
        run: |
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          uv tool install hatch
          hatch -v env create "$ENV_NAME"

      - name: Check NVIDIA SMI
        run: nvidia-smi

      - name: Run tests
        run: |
          mkdir -p test-data
          hatch run "${ENV_NAME}:run-cov" -v --color=yes -ra --junitxml=test-data/test-results.xml

      # coverage run combines the xdist workers' data itself (run.patch in pyproject.toml);
      # `coverage combine` after it finds nothing and fails
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          hatch run "${ENV_NAME}:coverage" xml
          hatch run "${ENV_NAME}:cov-report" --sort=cover --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() && contains(matrix.env.name, 'stable') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: test-data/test-results.xml
          use_oidc: false
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage data
        if: contains(matrix.env.name, 'stable')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: test-data/coverage.xml
          use_oidc: false
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  remove-label:
    name: Remove 'run-gpu-ci' Label
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-gpu-ci') }}
    permissions:
      pull-requests: write
    steps:
      - name: Remove 'run-gpu-ci' label
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-gpu-ci" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stable-dev-green:
    name: CI-Pass
    if: always()
    needs:
      - check
      - get-envs
      - test-stable-dev
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        if: needs.check.outputs.skip != 'true'
        run: |
          if [[ "${{ needs.get-envs.result }}" != "success" || "${{ needs.test-stable-dev.result }}" != "success" ]]; then
            echo "::error::Required jobs did not succeed (get-envs=${{ needs.get-envs.result }}, test-stable-dev=${{ needs.test-stable-dev.result }})."
            exit 1
          fi

  all-green:
    name: All Tests Green
    if: always()
    needs:
      - check
      - get-envs
      - test-stable-dev
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        if: needs.check.outputs.skip != 'true'
        run: |
          if [[ "${{ needs.get-envs.result }}" != "success" || "${{ needs.test-stable-dev.result }}" != "success" ]]; then
            echo "::error::Required jobs did not succeed (get-envs=${{ needs.get-envs.result }}, test-stable-dev=${{ needs.test-stable-dev.result }})."
            exit 1
          fi
